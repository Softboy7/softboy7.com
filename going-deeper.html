<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>going deeper</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
    overflow-x: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    transition:
        background 1.2s ease,
        color 1.2s ease;
}

.container {
    width: min(900px, 94vw);
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 40px 20px;

    text-align: center;
}


/* =========================
   MAIN MESSAGE
========================= */

#message {
    min-height: 28px;

    margin-bottom: 45px;

    font-family: "Press Start 2P", monospace;
    font-size: 12px;
    line-height: 1.8;

    letter-spacing: 0;

    text-shadow:
        0 0 5px rgba(255,255,255,.9),
        0 0 15px rgba(255,255,255,.45);
}


/* =========================
   SPECIAL DATE MESSAGE
========================= */

#dateMessage {
    max-width: 700px;

    margin-bottom: 30px;

    min-height: 90px;

    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    line-height: 2;

    letter-spacing: 0;

    opacity: 0;

    transition: opacity 1s ease;

    text-shadow:
        0 0 5px currentColor,
        0 0 15px currentColor;
}

#dateMessage.visible {
    opacity: 1;
}


/* =========================
   ASCII
========================= */

.ascii-box {
    padding: 25px 30px;

    border: none;
    box-shadow: none;
}

#ascii {
    margin: 0;
    padding: 0;

    font-family: "Courier New", monospace;

    font-size: clamp(9px, 1.5vw, 16px);
    line-height: 1.15;

    white-space: pre;

    color: #fff;

    text-align: left;

    text-shadow:
        0 0 3px #fff,
        0 0 7px rgba(255,255,255,.9),
        0 0 18px rgba(255,255,255,.5);

    user-select: none;
}

.blink-character {
    display: inline-block;
    transition: opacity .08s ease;
}


/* =========================
   WORD OF THE DAY
========================= */

.word-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;

    margin-top: 28px;
}

.word-label {
    font-family: "Press Start 2P", monospace;

    font-size: 7px;

    letter-spacing: 1px;

    margin-bottom: 10px;

    opacity: .55;

    user-select: none;
}

#wordBox {
    min-width: 170px;

    padding: 12px 18px;

    border: 1px solid rgba(255,255,255,.7);

    font-family: "Press Start 2P", monospace;

    font-size: 9px;

    letter-spacing: 0;

    cursor: pointer;

    user-select: none;

    transition:
        border-color .2s ease,
        box-shadow .2s ease,
        transform .1s ease;
}

#wordBox:hover {
    border-color: #fff;

    box-shadow:
        0 0 5px rgba(255,255,255,.8),
        0 0 15px rgba(255,255,255,.4);
}

#wordBox:active {
    transform: scale(.97);
}

#wordBox.used {
    cursor: default;
    opacity: .75;
}

#wordBox.used:hover {
    border-color: rgba(255,255,255,.7);
    box-shadow: none;
}


/* =========================
   SPECIAL DATE: MAY 7
========================= */

body.may7 {
    background: #000814;
    color: #dff4ff;
}

body.may7 #dateMessage,
body.may7 #ascii,
body.may7 .word-label {

    color: #dff4ff;

    text-shadow:
        0 0 4px #69cfff,
        0 0 12px #168cff,
        0 0 30px rgba(0,140,255,.8);
}

body.may7 #wordBox {

    border-color: rgba(100,200,255,.8);

    box-shadow:
        0 0 7px rgba(0,140,255,.5);
}


/* =========================
   SPECIAL DATE: JULY 25
========================= */

body.july25 {
    background: #fff;
    color: #000;
}

body.july25 #dateMessage,
body.july25 #ascii,
body.july25 .word-label {

    color: #000;

    text-shadow: none;
}

body.july25 #wordBox {

    border-color: #000;

    box-shadow: none;
}

body.july25 #wordBox:hover {

    box-shadow:
        0 0 8px rgba(0,0,0,.3);
}


/* =========================
   SPECIAL CONVERSATION
========================= */

#conversationOptions {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 8px;

    margin-top: 20px;

    width: min(650px, 90vw);
}

.conversation-option {

    width: 100%;

    padding: 10px 14px;

    background: transparent;

    color: inherit;

    border: 1px solid rgba(255,255,255,.45);

    font-family: "Press Start 2P", monospace;

    font-size: 7px;

    line-height: 1.8;

    cursor: pointer;

    transition:
        border-color .2s ease,
        box-shadow .2s ease,
        transform .1s ease;
}

.conversation-option:hover {

    border-color: currentColor;

    box-shadow:
        0 0 5px currentColor,
        0 0 12px rgba(255,255,255,.15);
}

.conversation-option:active {

    transform: scale(.98);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    #message {
        font-size: 9px;
        margin-bottom: 35px;
    }

    #dateMessage {
        font-size: 7px;
        line-height: 2;
    }

    .ascii-box {
        padding: 18px 10px;
        max-width: 100%;
        overflow-x: auto;
    }

    #ascii {
        font-size: 8px;
    }

    .word-label {
        font-size: 6px;
    }

    #wordBox {
        font-size: 7px;
        min-width: 150px;
    }

    .conversation-option {
        font-size: 6px;
        padding: 9px 10px;
    }
}

</style>
</head>


<body>


<!-- =========================
     AUDIO ELEMENTS
========================= -->

<audio id="backgroundMusic" loop>
    <source src="going-deeper.mp3" type="audio/mpeg">
</audio>

<audio id="typingSound" loop>
    <source src="typing.mp3" type="audio/mpeg">
</audio>

<audio id="rollSound">
    <source src="roll.mp3" type="audio/mpeg">
</audio>


<div class="container">


    <!-- MAIN MESSAGE -->

    <div id="message"></div>


    <!-- SPECIAL DATE MESSAGE -->

    <div id="dateMessage"></div>


    <!-- ASCII -->

    <div class="ascii-box">

<pre id="ascii">∞∞∞∞≈≈≈≈≈≈≈≈≈≈≈∞∞∞∞∞
∞∞≠++++++++++++++≈≈∞
∞∞≠++++++++++++++≈∞∞
∞∞≠+++<span class="blink-character">▓</span>+++++<span class="blink-character">▓</span>++++≈∞∞
∞∞≠++++++++++++++≈∞∞
∞∞≠++++++++++++++≈∞∞
∞∞≠+++++▀▀▀++++++≈∞∞
∞∞≠++++++++++++++≈∞∞
√∞∞∞∞≈≈≈≈≈≈≈≈≈≈≈≈∞
 √≈≈≈≈≈≈≈≈≈≈≈≈≈∞</pre>

    </div>


    <!-- WORD OF THE DAY -->

    <div class="word-wrapper">

        <div class="word-label">
            WORD OF THE DAY
        </div>

        <div id="wordBox">
            &gt;&gt;&gt;•&lt;&lt;&lt;
        </div>

    </div>


    <!-- SPECIAL CONVERSATION OPTIONS -->

    <div id="conversationOptions"></div>


</div>


<script>


/* =========================================================
   BACKGROUND MUSIC & SOUNDS
========================================================= */

const backgroundMusic =
    document.getElementById("backgroundMusic");

const typingSound =
    document.getElementById("typingSound");

const rollSound =
    document.getElementById("rollSound");

backgroundMusic.volume = 0;

let musicStarted = false;

function startMusic() {

    if (musicStarted) {
        return;
    }

    musicStarted = true;

    backgroundMusic.play()
        .then(() => {

            let volume = 0;

            const fadeIn =
                setInterval(() => {

                    volume += 0.01;

                    backgroundMusic.volume = volume;

                    if (volume >= 0.35) {

                        backgroundMusic.volume = 0.35;

                        clearInterval(fadeIn);
                    }

                }, 40);

        })
        .catch(() => {

            musicStarted = false;

        });
}


/*
   Try autoplay immediately.

   If the browser blocks it,
   the first click will start it.
*/

startMusic();

document.addEventListener(
    "click",
    startMusic,
    { once: true }
);


function startTypingSound() {
    if (typingSound.paused) {
        typingSound.currentTime = 0;
        typingSound.play().catch(() => {});
    }
}

function stopTypingSound() {
    typingSound.pause();
    typingSound.currentTime = 0;
}

function playRollSound() {
    rollSound.currentTime = 0;
    rollSound.play().catch(() => {});
}


/* =========================================================
   ASCII BLINK
========================================================= */

const blinkCharacters =
    document.querySelectorAll(".blink-character");


function blink() {

    const delay =
        Math.random() * 8000 + 7000;


    setTimeout(() => {

        blinkCharacters.forEach(character => {

            character.textContent = "=";

        });


        setTimeout(() => {

            blinkCharacters.forEach(character => {

                character.textContent = "▓";

            });

            blink();

        }, 1000);

    }, delay);
}


blink();


/* =========================================================
   ELEMENTS
========================================================= */

const message =
    document.getElementById("message");

const dateMessage =
    document.getElementById("dateMessage");

const wordBox =
    document.getElementById("wordBox");

const conversationOptions =
    document.getElementById("conversationOptions");


/* =========================================================
   TYPING EFFECT
========================================================= */

function typeText(element, html, speed = 55) {

    element.innerHTML = "";

    let index = 0;

    startTypingSound();


    return new Promise(resolve => {


        function type() {


            if (index >= html.length) {

                stopTypingSound();

                resolve();

                return;
            }


            /*
               If we encounter an HTML tag,
               add the entire tag instantly.
            */

            if (html[index] === "<") {

                const closingTag =
                    html.indexOf(">", index);

                if (closingTag !== -1) {

                    const tag =
                        html.slice(
                            index,
                            closingTag + 1
                        );

                    element.insertAdjacentHTML(
                        "beforeend",
                        tag
                    );

                    index =
                        closingTag + 1;

                    setTimeout(type, speed);

                    return;
                }
            }


            /*
               Add one normal character.
            */

            const character =
                html[index];

            element.insertAdjacentText(
                "beforeend",
                character
            );

            index++;


            /*
               Half-second pause after
               periods and question marks.
            */

            if (
                character === "." ||
                character === "?"
            ) {

                stopTypingSound();

                setTimeout(
                    () => {
                        startTypingSound();
                        type();
                    },
                    500
                );

            } else {

                setTimeout(
                    type,
                    speed
                );

            }

        }


        type();

    });
}


/* =========================================================
   DATE
========================================================= */

const today =
    new Date();

const month =
    today.getMonth() + 1;

const day =
    today.getDate();


/* =========================================================
   SPECIAL DATES
========================================================= */

if (
    month === 5 &&
    day === 7
) {

    message.style.display = "none";

    document.body.classList.add("may7");


    const mayText =
        "7th of May 2023, the day it all began. Months of preparation to show the world something raw. I had no idea that it would change my life.";


    dateMessage.classList.add(
        "visible"
    );


    typeText(
        dateMessage,
        mayText,
        38
    );


}


else if (
    month === 7 &&
    day === 25
) {

    message.style.display = "none";

    document.body.classList.add("july25");


    const julyText =
        "25th of July. A summer day when the seal was broken. 1,5 years of preparation to show the world something hopeful. My gratitude was endless.";


    dateMessage.classList.add(
        "visible"
    );


    typeText(
        dateMessage,
        julyText,
        38
    );


}


else {

    typeText(
        message,
        "come back another time",
        65
    );

}


/* =========================================================
   WORD LIST
========================================================= */

const words = [

    "angel",
    "letter",
    "data",
    "flower",
    "dream",
    "promise",
    "brazil",
    "night",
    "nightsky",
    "fast",
    "above",
    "piano",
    "lost",
    "final",
    "exhaustion",
    "vulnerable",
    "sabotage",
    "attempt",
    "ground",
    "revenge",
    "disappointment",
    "smile",
    "you",
    "sorry",
    "forget",
    "beautiful",
    "hope",
    "shine",
    "beginnings",
    "progress",
    "meaning",
    "cute",
    "dark",
    "alternative",
    "questioning",
    "mirror",
    "starflower",
    "star",
    "future",
    "tram",
    "sensitive",
    "overwhelmed",
    "confident",
    "eyesight",
    "comfort",
    "end"

];


/* =========================================================
   RANDOM MESSAGE LIST
========================================================= */

const randomMessages = [

    `Did you know? Softboy7 made a track about me called <i>dead pc</i>. He even made a music video for it. I think he's a big fan of mine.`,

    `Seems like you've got lucky today.`,

    `Nice word! Here, let me translate it for you into my language: ࿐°ᐢ  ⬒☁︎✦  ⬔✦⬒ᐢ⑅*✧ᐢ✢... I lied. I can not actually read your word of the day. I wish I could, but a box is around it. I'm sorry.`,

    `You know what? I'm giving a second word of the day on top: existence. Yeah, think about that. If you want to.`,

    `This is the word your soulmate will say to you one day. Although my calculations suggest that may not be true. But a PC can dream, right?`,

    `I Herd U Liek Mudkips. Hehehe. Not funny? Sorry, I'm trying to learn internet humor.`,

    `Did I actually die in "dead pc"? Am I a ghost or something? Or did someone fix me? Or do I have to fix myself? ... Thanks for visiting btw. It helps with the overthinking.`,

    `What a lovely word. I hope. If not, I'm here for you. Kinda.`,

    `I'm still tired from the rave. What about you? Are you satisfied with your word? If not, maybe you can view it from a different angle?`,

    `I do wanna visit flower forest one day. It's in a game called Minecraft. There is a 1 in 46 chance that I just talked about your word of the day. Wait. No. There is another word that messes all the probabilities up.`,

    `And that was the final word of the ultimate internet duel. What's the ultimate internet duel? I don't know. I just made it up.`,

    `If I were a parent, I would say that word to my child. Or maybe not. Maybe I should read the word before saying stuff like this.`,

    `You know, I played this game called "Kitty Toy" on itch.io the other day. Pretty cozy game.`,

    `I'd like to give you a compliment, but sadly I don't know anything about you. Okay, I do know that you somehow got here. You're smart. Did that make you feel better?`,

    `That's an interesting word. At least that's my opinion.`,

    `I like these things that start with key and end with gen. Oh wait, they're not allowed? But their aesthetic makes me comfortable... Of course I didn't download them. I saw them in a YouTube video!`,

    `This place called "above the layers"... I saw it with my own eyes. It's beautiful!`,

    `I do feel guilty about losing all of your data.`,

    `I don't wanna assume which word you got. Because assuming makes an "ass" out of "u" and "ming"! I totally stole this one.`,

    `You know, this conversation feels a bit one-sided. I want you to say something:`

];


/* =========================================================
   SPECIAL CONVERSATION
========================================================= */

const conversationChoices = [

    {
        text: "I'm happy.",
        response:
            "I'm glad that you feel this way. What a beautiful emotion to have."
    },

    {
        text: "I'm sad.",
        response:
            "Thank you for opening up to me. You don't need to hide it from me."
    },

    {
        text: "I'm angry.",
        response:
            "Thanks for being honest. I hear you loud and clear."
    },

    {
        text: "I'm calm.",
        response:
            "Peace be upon you, my friend. In calmness lies strength."
    },

    {
        text: "I'm afraid nobody really knows me.",
        response:
            "You're speaking to me right now. That counts as being known a little."
    },

    {
        text: "I don't know what I'm doing with my life.",
        response:
            "That's okay. You don't have to have everything figured out. Sometimes not knowing where you're going leaves room for something wonderful."
    },

    {
        text: "Nice weather, isn't it?",
        response:
            "HOW INTERESTING. Seems like someone doesn't want to talk about emotions. That's okay tho. So... about the weather. Sadly, I can't look outside. But thanks for telling me something about the world :)"
    }

];


/* =========================================================
   RANDOM WORD
========================================================= */

function getRandomWord() {

    if (Math.random() < 0.005) {

        return "divider";

    }


    return words[
        Math.floor(
            Math.random() * words.length
        )
    ];

}


/* =========================================================
   SPECIAL CONVERSATION UI
========================================================= */

function showConversationOptions() {

    conversationOptions.innerHTML = "";


    conversationChoices.forEach(
        (choice) => {


            const button =
                document.createElement("button");


            button.className =
                "conversation-option";


            button.textContent =
                choice.text;


            button.addEventListener(
                "click",
                async () => {

                    conversationOptions.innerHTML = "";


                    await typeText(
                        message,
                        choice.response,
                        55
                    );

                }
            );


            conversationOptions.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   SHOW RANDOM MESSAGE AFTER WORD ROLL
========================================================= */

async function showRandomMessage() {

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                1000
            )
    );


    const randomMessage =
        randomMessages[
            Math.floor(
                Math.random() *
                randomMessages.length
            )
        ];


    await typeText(
        message,
        randomMessage,
        55
    );


    if (
        randomMessage ===
        randomMessages[
            randomMessages.length - 1
        ]
    ) {

        showConversationOptions();

    }

}


/* =========================================================
   DAILY WORD STORAGE
========================================================= */

let shuffling = false;


const todayKey =
    today.getFullYear() +
    "-" +
    String(month).padStart(2, "0") +
    "-" +
    String(day).padStart(2, "0");


const savedDay =
    localStorage.getItem(
        "goingDeeperWordDay"
    );


const savedWord =
    localStorage.getItem(
        "goingDeeperWord"
    );


if (
    savedDay === todayKey &&
    savedWord
) {

    wordBox.textContent =
        savedWord;

    wordBox.classList.add(
        "used"
    );

    wordBox.style.cursor =
        "default";

}


/* =========================================================
   WORD ROLLING
========================================================= */

async function shuffleWords() {


    if (shuffling) {
        return;
    }


    if (
        localStorage.getItem(
            "goingDeeperWordDay"
        ) === todayKey
    ) {

        return;

    }


    /* Play click sound effect once upon click */
    playRollSound();


    shuffling = true;


    let elapsed = 0;

    let interval = 45;


    function shuffle() {


        wordBox.textContent =
            getRandomWord();


        elapsed += interval;


        if (elapsed < 700) {

            interval = 45;

        }


        else if (elapsed < 1200) {

            interval += 10;

        }


        else if (elapsed < 1700) {

            interval += 22;

        }


        else {

            const finalWord =
                getRandomWord();


            wordBox.textContent =
                finalWord;


            shuffling = false;


            localStorage.setItem(
                "goingDeeperWordDay",
                todayKey
            );


            localStorage.setItem(
                "goingDeeperWord",
                finalWord
            );


            wordBox.classList.add(
                "used"
            );


            wordBox.style.cursor =
                "default";


            showRandomMessage();


            return;

        }


        setTimeout(
            shuffle,
            interval
        );

    }


    shuffle();

}


/* =========================================================
   WORD CLICK
========================================================= */

wordBox.addEventListener(
    "click",
    shuffleWords
);


</script>

</body>
</html>
</html>
